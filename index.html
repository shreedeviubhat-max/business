<body
  class="min-h-screen bg-gradient-to-br from-primary to-secondary font-sans text-gray-800 dark:bg-surface dark:text-gray-200">
  <!-- Header -->
  <header class="p-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-white dark:text-gray-100">Credit Ledger</h1>
    <button id="addBtn"
      class="flex items-center gap-2 bg-white/80 hover:bg-white transition rounded-full px-4 py-2 text-sm font-medium shadow-md">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-primary" fill="none" viewBox="0 0 24 24"
        stroke="currentColor">

      + Add Customer
    </button>
  </header>

  <!-- Dashboard grid -->
  <main class="p-4">
    <section id="customerGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <!-- Cards inserted by JS -->
    </section>
  </main>

  <!-- Add / Edit Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-md mx-4 p-6 relative animate-fade-in">
      <button id="closeModal" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <h2 id="modalTitle" class="text-xl font-semibold mb-4 text-gray-800 dark:text-gray-200">
        Add Customer
      </h2>

      <form id="customerForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1" for="nameInput">Name</label>
          <input id="nameInput" type="text" required
            class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1" for="phoneInput">Phone</label>
          <input id="phoneInput" type="tel"
            class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1" for="addressInput">Address</label>
          <textarea id="addressInput" rows="2"
            class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1" for="amountInput">Amount (₹)</label>
          <input id="amountInput" type="number" step="0.01" required

          <label class="block text-sm font-medium mb-1" for="dateInput">Date</label>
          <input id="dateInput" type="date" required
            class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1" for="photoInput">Photo (optional)</label>
          <input id="photoInput" type="file" accept="image/*" class="w-full" />

        <div class="flex justify-end gap-2 pt-2">

  <!-- Detail Modal -->
  <div id="detailOverlay" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 hidden">

      <button id="closeDetail" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />

      </button>

        </div>

        <div class="flex-1 space-y-2">
          <p><span class="font-medium">Phone:</span> <span id="detailPhone"></span></p>
          <p><span class="font-medium">Address:</span> <span id="detailAddress"></span></p>
          <p><span class="font-medium">Date Added:</span> <span id="detailDate"></span></p>
          <p><span class="font-medium">Amount Owed:</span> ₹ <span id="detailAmount"></span></p>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-6">
        <button id="editBtn" class="px-4 py-2 rounded-md bg-primary text-white hover:bg-primary/90 transition">
          Edit
        </button>
        <button id="deleteBtn" class="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700 transition">
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    /* ---------- LocalStorage helpers ---------- */
    const LS_KEY = "creditLedgerCustomers";
    const generateId = () => '_' + Math.random().toString(36).substr(2, 9);
    const loadCustomers = () => JSON.parse(localStorage.getItem(LS_KEY) || '[]');
    const saveCustomers = data => localStorage.setItem(LS_KEY, JSON.stringify(data));
    const fmtCurrency = n => Number(n).toLocaleString('en-IN', { style: 'currency', currency: 'INR' });

    /* ---------- UI Rendering ---------- */
    const renderGrid = () => {
      const customers = loadCustomers();
      const grid = document.getElementById('customerGrid');
      grid.innerHTML = '';

      if (customers.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-gray-600">No customers yet. Click “+ Add Customer” to start.</p>';
        return;
      }

      customers.forEach(c => {
        const card = document.createElement('div');
        card.className = 'glass-card p-4 cursor-pointer hover:scale-[1.02] transition transform';
        card.dataset.id = c.id;

        const avatar = c.photo ||
          `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(c.name)}`;

        card.innerHTML = `
          <div class="flex items-center gap-4">
            <img src="${avatar}" alt="Avatar"
                 class="w-14 h-14 rounded-full object-cover border-2 border-primary"/>
            <div class="flex-1">
              <h3 class="font-semibold text-lg truncate">${c.name}</h3>
              <p class="text-sm text-primary font-medium">${fmtCurrency(c.amount)}</p>
              <p class="text-xs text-gray-600 dark:text-gray-400">${c.phone || ''} • ${new Date(c.date).toLocaleDateString()}</p>
            </div>
          </div>`;
        card.addEventListener('click', () => openDetail(c.id));
        grid.appendChild(card);
      });
    };

    /* ---------- Modal handling ---------- */
    const modalOverlay = document.getElementById('modalOverlay');
    const detailOverlay = document.getElementById('detailOverlay');
    const addBtn = document.getElementById('addBtn');
    const closeModalBtn = document.getElementById('closeModal');
    const cancelBtn = document.getElementById('cancelBtn');
    const customerForm = document.getElementById('customerForm');
    const modalTitle = document.getElementById('modalTitle');
    const dateInput = document.getElementById('dateInput');

    let editMode = false;
    let editId = null;

    const openModal = (mode = 'add', data = null) => {
      editMode = mode === 'edit';
      modalTitle.textContent = editMode ? 'Edit Customer' : 'Add Customer';
      if (editMode && data) {
        document.getElementById('nameInput').value = data.name;
        document.getElementById('phoneInput').value = data.phone || '';
        document.getElementById('addressInput').value = data.address || '';
        document.getElementById('amountInput').value = data.amount;
        document.getElementById('dateInput').value = data.date;
        document.getElementById('photoInput').value = '';
        editId = data.id;
      } else {
        customerForm.reset();
        // default date = today
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;
        editId = null;
      }
      modalOverlay.classList.remove('hidden');
    };

    const closeModal = () => modalOverlay.classList.add('hidden');
    const closeDetail = () => detailOverlay.classList.add('hidden');

    addBtn.addEventListener('click', () => openModal('add'));
    closeModalBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);

    /* ---------- Form submit (Add / Edit) ---------- */
    customerForm.addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('nameInput').value.trim();
      const phone = document.getElementById('phoneInput').value.trim();
      const address = document.getElementById('addressInput').value.trim();
      const date = document.getElementById('dateInput').value;
      const amount = document.getElementById('amountInput').value;
      const fileInp = document.getElementById('photoInput');

      let photo = null;
      if (fileInp.files && fileInp.files[0]) {
        const file = fileInp.files[0];
        photo = await new Promise(res => {
          const r = new FileReader();
          r.onload = () => res(r.result);
          r.readAsDataURL(file);
        });
      }

      const customers = loadCustomers();

      if (editMode && editId) {
        const idx = customers.findIndex(c => c.id === editId);
        if (idx > -1) {
          customers[idx] = { ...customers[idx], name, phone, address, date, amount, photo: photo ?? customers[idx].photo };
        }
      } else {
        customers.push({ id: generateId(), name, phone, address, date, amount, photo });
      }

      saveCustomers(customers);
      renderGrid();
      closeModal();
    });

    /* ---------- Detail view ---------- */
    const openDetail = id => {
      const customers = loadCustomers();
      const cust = customers.find(c => c.id === id);
      if (!cust) return;

      document.getElementById('detailName').textContent = cust.name;
      document.getElementById('detailPhone').textContent = cust.phone || '—';
      document.getElementById('detailAddress').textContent = cust.address || '—';
      document.getElementById('detailDate').textContent = new Date(cust.date).toLocaleDateString();
      document.getElementById('detailAmount').textContent = fmtCurrency(cust.amount);
      document.getElementById('detailPhoto').src = cust.photo ||
        `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(cust.name)}`;

      document.getElementById('editBtn').onclick = () => {
        closeDetail();
        openModal('edit', cust);
      };
      document.getElementById('deleteBtn').onclick = () => {
        if (confirm('Delete this customer permanently?')) {
          const updated = customers.filter(c => c.id !== id);
          saveCustomers(updated);
          renderGrid();
          closeDetail();
        }
      };
      detailOverlay.classList.remove('hidden');
    };

    document.getElementById('closeDetail').addEventListener('click', closeDetail);

    /* ---------- Initialise ---------- */
    renderGrid();
  </script>
</body>
